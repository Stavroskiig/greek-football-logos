<div
  class="flex flex-col items-center p-4 rounded-lg bg-white dark:bg-gray-800 shadow-sm transition-all duration-300 ease-in-out w-full h-full box-border relative hover:-translate-y-1 hover:shadow-lg dark:hover:shadow-gray-900/50">
  <!-- History Icon (Top Left) -->
  <button *ngIf="logo.historicalLogos && logo.historicalLogos.length > 1"
    class="absolute top-2 left-2 w-7 h-7 rounded-full bg-white/90 dark:bg-gray-700/90 border-none flex items-center justify-center cursor-pointer text-gray-700 dark:text-gray-300 p-0 shadow-sm transition-colors duration-200 ease-in-out z-10 hover:bg-white dark:hover:bg-gray-600 hover:text-blue-600 dark:hover:text-blue-400"
    (click)="showTeamHistory()" [attr.aria-label]="'View history for ' + logo.name">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
      <path fill="currentColor"
        d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022l-.074.997zm2.004.45a7.003 7.003 0 0 0-.985-.299l.219-.976c.383.086.76.2 1.126.342l-.36.933zm1.37.71a7.01 7.01 0 0 0-.439-.27l.493-.87a8.025 8.025 0 0 1 .979.654l-.615.789a6.996 6.996 0 0 0-.418-.302zm1.834 1.79a6.99 6.99 0 0 0-.653-.796l.724-.69c.27.285.52.59.747.91l-.818.576zm.744 1.352a7.08 7.08 0 0 0-.214-.468l.893-.45a7.976 7.976 0 0 1 .45 1.088l-.95.313a7.023 7.023 0 0 0-.179-.483zm.53 2.507a6.991 6.991 0 0 0-.1-1.025l.985-.17c.067.386.106.778.116 1.17l-1 .025zm-.131 1.538c.033-.17.06-.339.081-.51l.993.123a7.957 7.957 0 0 1-.23 1.155l-.964-.267c.046-.165.086-.332.12-.501zm-.952 2.379c.184-.29.346-.594.486-.908l.914.405c-.16.36-.345.706-.555 1.038l-.845-.535zm-1.783 1.748c.24-.21.465-.436.671-.676l.764.646a8.03 8.03 0 0 1-.935.882l-.5-.852zm-2.43 1.056c.28-.109.55-.235.81-.376l.462.887c-.309.16-.632.302-.966.42l-.306-.931zm-2.553.182c.22-.021.439-.052.657-.091l.178.984c-.261.047-.525.084-.791.111l-.044-.997zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3.5a.5.5 0 0 0 .5-.5v-4z"/>
    </svg>
  </button>
  <!-- Zoom Icon (Top Right) -->
  <button
    class="absolute top-2 right-2 w-7 h-7 rounded-full bg-white/90 dark:bg-gray-700/90 border-none flex items-center justify-center cursor-pointer text-gray-700 dark:text-gray-300 p-0 shadow-sm transition-colors duration-200 ease-in-out z-10 hover:bg-white dark:hover:bg-gray-600 hover:text-blue-600 dark:hover:text-blue-400"
    (click)="showFullImage()" [attr.aria-label]="'View full size logo for ' + logo.name">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
      <path fill="currentColor"
        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" />
    </svg>
  </button>
  <div class="w-24 h-24 flex items-center justify-center mb-3 flex-shrink-0 relative">
    <div class="absolute inset-0 flex items-center justify-center bg-gray-100 dark:bg-gray-700 rounded"
      *ngIf="!imageLoaded">
      <div
        class="w-5 h-5 border-2 border-gray-200 dark:border-gray-600 border-t-blue-500 dark:border-t-blue-400 rounded-full animate-spin">
      </div>
    </div>
    <img [src]="logo.path" [alt]="logo.name + ' Logo / Λογότυπο'" [title]="logo.name + ' Logo / Λογότυπο'"
      loading="lazy" (load)="onImageLoad()" (error)="handleImageError($event)" [class.opacity-100]="imageLoaded"
      class="max-w-full max-h-full object-contain block opacity-0 p-1 transition-opacity duration-300 ease-in-out">
  </div>
  <h3
    class="m-0 text-sm text-center font-semibold text-gray-700 dark:text-gray-200 leading-tight w-full overflow-hidden text-ellipsis whitespace-nowrap cursor-help relative transition-all duration-300 ease-in-out hover:overflow-visible hover:whitespace-normal hover:z-10 hover:bg-white dark:hover:bg-gray-700 hover:p-1 hover:rounded hover:shadow-sm hover:-translate-y-0.5"
    [title]="logo.name">{{ logo.name }}</h3>
  <p class="mt-1 mb-0 text-xs text-gray-500 dark:text-gray-400 text-center leading-tight w-full overflow-hidden text-ellipsis whitespace-nowrap cursor-help relative transition-all duration-300 ease-in-out hover:overflow-visible hover:whitespace-normal hover:z-10 hover:bg-white dark:hover:bg-gray-700 hover:p-1 hover:rounded hover:shadow-sm hover:-translate-y-0.5"
    *ngIf="logo.league" [title]="logo.league.name">{{ logo.league.name }}</p>
  <div class="flex gap-2 mt-3 w-full">
    <button
      class="flex-1 py-2 border-none rounded text-xs cursor-pointer transition-all duration-200 ease-in-out flex items-center justify-center min-h-8 bg-[#055eb1] text-white hover:bg-blue-700 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      (click)="downloadLogo()" [attr.aria-label]="'Download logo for ' + logo.name">
      <!-- Download Icon -->
      <svg class="w-4 h-4 text-white dark:text-white mr-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
        width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd"
          d="M13 11.15V4a1 1 0 1 0-2 0v7.15L8.78 8.374a1 1 0 1 0-1.56 1.25l4 5a1 1 0 0 0 1.56 0l4-5a1 1 0 1 0-1.56-1.25L13 11.15Z"
          clip-rule="evenodd" />
        <path fill-rule="evenodd"
          d="M9.657 15.874 7.358 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-2.358l-2.3 2.874a3 3 0 0 1-4.685 0ZM17 16a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H17Z"
          clip-rule="evenodd" />
      </svg>
      {{ 'logo.download' | translate }}
    </button>

  </div>
</div>

<header class="header">
  <div class="header-content">
    <!-- Logo -->
    <a routerLink="/" class="logo-link">
      <img src="/assets/app-logo/app-logo.png" alt="Logo" class="logo" />
    </a>

    <!-- Navigation - Centered -->
    <nav class="navigation">
      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
        <a routerLink="/misc" routerLinkActive="active" class="nav-link">Misc</a>
        <a routerLink="/suggest" routerLinkActive="active" class="nav-link">Suggest</a>
        <a routerLink="/games" routerLinkActive="active" class="nav-link">Games</a>
        <a routerLink="/collections" routerLinkActive="active" class="nav-link">Collections</a>
        <a routerLink="/admin" routerLinkActive="active" class="nav-link">Admin</a>
        <button (click)="toggleTheme()"
          class="nav-link flex items-center justify-center p-2 rounded-full cursor-pointer transition-colors duration-200"
          aria-label="Toggle dark mode" title="Toggle Theme">
          <!-- Sun Icon (shows when dark mode is active) -->
          <svg *ngIf="isDarkMode()" class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor"
            viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
            </path>
          </svg>
          <!-- Moon Icon (shows when light mode is active) -->
          <svg *ngIf="!isDarkMode()" class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
        </button>
      </div>
    </nav>
  </div>
</header>

<div class="container mx-auto px-4 py-8 max-w-6xl">
  <!-- Back button -->
  <a routerLink="/" class="inline-flex items-center justify-center px-5 py-2.5 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-full shadow-sm hover:shadow-md transition-all font-medium mb-8 group">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" class="mr-2 transform group-hover:-translate-x-1 transition-transform">
      <path fill="currentColor" fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
    </svg>
    {{ 'common.back' | translate }}
  </a>

  <div *ngIf="loading" class="flex justify-center items-center py-20">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 dark:border-blue-400"></div>
  </div>

  <div *ngIf="!loading && team" class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8">
    <div class="flex items-center gap-6 mb-12 border-b border-gray-200 dark:border-gray-700 pb-8">
      <img *ngIf="team.path" [src]="team.path" [alt]="team.name" class="w-32 h-32 object-contain drop-shadow-md">
      <div>
        <h1 class="text-4xl font-bold text-gray-800 dark:text-white m-0">{{ team.name }}</h1>
        <p class="text-xl text-gray-500 dark:text-gray-400 mt-2">{{ 'details.historical_logos' | translate }}</p>
      </div>
    </div>

    <div *ngIf="!team.historicalLogos || team.historicalLogos.length === 0" class="text-center py-12 text-gray-500 dark:text-gray-400 text-lg">
      No historical logos found for this team.
    </div>

    <div *ngIf="team.historicalLogos && team.historicalLogos.length > 0" class="mt-12">
      
      <!-- DESKTOP SNEAKING TIMELINE (md and up) -->
      <div class="hidden md:flex flex-col items-center mx-auto">
        <ng-container *ngFor="let chunk of chunkedLogos; let r = index; let lastRow = last">
          
          <!-- Row of Cards -->
          <div class="flex items-center w-[944px]" [ngClass]="{'flex-row': r % 2 === 0, 'flex-row-reverse': r % 2 !== 0}">
            <ng-container *ngFor="let hLogo of chunk; let i = index; let lastItem = last">
              
              <!-- Card -->
              <div class="flex flex-col items-center p-5 rounded-xl bg-white dark:bg-gray-800 shadow-sm border border-gray-100 dark:border-gray-700 transition-all duration-300 ease-in-out w-[200px] flex-shrink-0 relative hover:-translate-y-1 hover:shadow-xl dark:hover:shadow-gray-900/50 group">
                <div class="w-32 h-32 flex items-center justify-center mb-5">
                  <img [src]="hLogo.path" [alt]="hLogo.name" class="max-w-full max-h-full object-contain drop-shadow-md group-hover:scale-110 transition-transform duration-300">
                </div>
                <div class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-4 py-1.5 rounded-full text-sm font-semibold text-center w-full truncate shadow-inner">
                  <ng-container *ngIf="!hLogo.startYear && !hLogo.endYear">Current</ng-container>
                  <ng-container *ngIf="hLogo.startYear || hLogo.endYear">
                    {{ hLogo.startYear || '?' }} - {{ hLogo.endYear || 'Present' }}
                  </ng-container>
                </div>
              </div>

              <!-- Connecting Arrow (Horizontal) -->
              <div *ngIf="!lastItem" class="w-8 flex-shrink-0 mx-2 flex justify-center text-gray-300 dark:text-gray-600 animate-pulse">
                <svg *ngIf="r % 2 === 0" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                <svg *ngIf="r % 2 !== 0" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
              </div>
            </ng-container>

            <!-- Fill remaining space if chunk has fewer than 4 items to keep exact alignment -->
            <ng-container *ngFor="let empty of getEmptySlots(4 - chunk.length)">
              <!-- Filler Arrow -->
              <div class="w-8 flex-shrink-0 mx-2 opacity-0 pointer-events-none"></div>
              <!-- Filler Card -->
              <div class="w-[200px] flex-shrink-0 opacity-0 pointer-events-none"></div>
            </ng-container>
          </div>

          <!-- Connecting Arrow (Vertical) between rows -->
          <div *ngIf="!lastRow" class="flex w-[944px]" [ngClass]="{'justify-end': r % 2 === 0, 'justify-start': r % 2 !== 0}">
            <div class="w-[200px] flex justify-center text-gray-300 dark:text-gray-600 animate-pulse pt-4 pb-4">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
            </div>
          </div>
        </ng-container>
      </div>

      <!-- MOBILE VERTICAL TIMELINE (sm and down) -->
      <div class="flex md:hidden flex-col items-center gap-y-4">
        <ng-container *ngFor="let hLogo of team.historicalLogos; let lastItem = last">
          <!-- Card -->
          <div class="flex flex-col items-center p-5 rounded-xl bg-white dark:bg-gray-800 shadow-sm border border-gray-100 dark:border-gray-700 w-[240px] relative">
            <div class="w-32 h-32 flex items-center justify-center mb-5">
              <img [src]="hLogo.path" [alt]="hLogo.name" class="max-w-full max-h-full object-contain drop-shadow-md">
            </div>
            <div class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-4 py-1.5 rounded-full text-sm font-semibold text-center w-full truncate shadow-inner">
              <ng-container *ngIf="!hLogo.startYear && !hLogo.endYear">Current</ng-container>
              <ng-container *ngIf="hLogo.startYear || hLogo.endYear">
                {{ hLogo.startYear || '?' }} - {{ hLogo.endYear || 'Present' }}
              </ng-container>
            </div>
          </div>

          <!-- Vertical Down Arrow -->
          <div *ngIf="!lastItem" class="text-gray-300 dark:text-gray-600 animate-pulse py-2">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
          </div>
        </ng-container>
      </div>
      
    </div>


  </div>

  <div *ngIf="!loading && !team" class="text-center py-20 text-gray-500 text-xl">
    Team not found.
  </div>
</div>

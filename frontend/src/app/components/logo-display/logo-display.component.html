<main class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
  <div>

    <!-- Search and Filters -->
    <div
      class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 max-w-[1200px] mx-auto p-6 space-y-6 mb-8 transition-colors duration-200">
      <div class="flex flex-col lg:flex-row gap-6 items-stretch lg:items-center">

        <!-- Search Box -->
        <div class="flex-1">
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
            <input type="text" [(ngModel)]="searchTerm" (input)="applyFilters()"
              [placeholder]="'search.placeholder' | translate" [attr.aria-label]="'search.placeholder' | translate"
              class="block w-full pl-12 pr-10 py-3 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent shadow-sm transition-all duration-200" />
            <button type="button" *ngIf="searchTerm" (click)="clearSearch()" aria-label="Clear search"
              class="absolute inset-y-0 right-0 pr-4 flex items-center hover:bg-gray-100 dark:hover:bg-gray-600 rounded-full p-1 transition">
              <svg
                class="h-5 w-5 text-gray-400 dark:text-gray-300 hover:text-gray-600 dark:hover:text-white transition-colors"
                fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>

        <!-- League Selector -->
        <div class="w-full lg:w-64 shrink-0">
          <app-league-selector [selectedLeague]="selectedLeague"
            (leagueChange)="onLeagueChange($event)"></app-league-selector>
        </div>
      </div>

      <!-- Results Count -->
      <div *ngIf="logos" class="pt-4 border-t border-gray-100 dark:border-gray-700">
        <div class="flex flex-wrap items-center gap-3">
          <!-- Results Badge -->
          <div
            class="flex items-center gap-2 bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 px-3 py-1.5 rounded-lg border border-blue-200 dark:border-blue-800 transition-colors duration-200">
            <img src="assets/counter/team-counter.png" alt="Results" class="h-5 w-auto" />
            <span class="text-sm font-medium">
              {{ totalElements }} {{ (totalElements === 1 ? 'filters.logo' : 'filters.logos') | translate }}
            </span>
          </div>

          <!-- League Badge -->
          <div *ngIf="selectedLeague"
            class="flex items-center gap-2 bg-gray-50 dark:bg-gray-700/50 text-gray-700 dark:text-gray-300 px-3 py-1.5 rounded-lg border border-gray-200 dark:border-gray-600 transition-colors duration-200">
            <img [src]="getLeagueLogoPath(selectedLeague)" alt="League Badge" class="h-5 w-auto object-contain" (error)="onImageError($event)" />
            <span class="text-sm font-medium">{{ getDisplayName(selectedLeague) }}</span>
          </div>

          <!-- Refresh Data Button -->
          <button (click)="refreshData()" [disabled]="isLoading"
            class="flex items-center gap-2 ml-auto px-3 py-1.5 text-sm text-gray-600 hover:text-gray-900 bg-white hover:bg-gray-100 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 dark:hover:text-white border border-gray-200 dark:border-gray-600 rounded-lg shadow-sm transition-all duration-200 disabled:opacity-50">
            <svg *ngIf="isLoading" class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <svg *ngIf="!isLoading" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            Refresh Data
          </button>
        </div>
      </div>
    </div>

    <!-- Logo Grid -->
    <section
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4 md:gap-6">
      <app-logo-item *ngFor="let logo of logos" [logo]="logo"></app-logo-item>
    </section>

    <!-- Loading Indicator -->
    <section *ngIf="isLoading" class="text-center py-8 transition-colors duration-200">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500"></div>
      <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Loading logos...</p>
    </section>

    <!-- No Results -->
    <section *ngIf="logos.length === 0 && !isLoading" class="text-center py-16 transition-colors duration-200">
      <div class="max-w-md mx-auto">
        <svg class="mx-auto h-12 w-12 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6-4h6m2 5.291A7.962 7.962 0 0112 15c-2.34 0-4.47-.881-6.08-2.33" />
        </svg>
        <h3 class="mt-4 text-lg font-medium text-gray-900 dark:text-gray-100">{{ 'search.no_teams' | translate }}</h3>
        <p class="mt-2 text-gray-500 dark:text-gray-400">{{ 'search.try_adjusting' | translate }}</p>
      </div>
    </section>

  </div>

</main>

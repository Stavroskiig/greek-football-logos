<div
  class="fixed inset-0 flex justify-center items-center z-[999] bg-black/80 dark:bg-gray-800/95 backdrop-blur-sm transition-all duration-300"
  (click)="modalService.closeModal()">
  <div class="bg-transparent relative p-0" (click)="$event.stopPropagation()">
    <button
      class="absolute -top-12 -right-12 bg-transparent border-none text-4xl cursor-pointer text-white/50 hover:text-white p-2 z-10 transition-colors"
      (click)="modalService.closeModal()">×</button>
    <img [src]="(modalService.modalData$ | async)?.logoPath"
      [alt]="(modalService.modalData$ | async)?.teamInfo?.name + ' logo'"
      class="max-w-[90vw] max-h-[90vh] object-contain transition-all duration-300">
  </div>
</div>

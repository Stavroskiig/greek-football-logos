<div class="flex flex-col h-[calc(100vh-120px)] bg-gray-100 dark:bg-gray-900">
    <!-- Header / League Selector -->
    <div
        class="w-full bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 p-4 z-10 flex flex-nowrap overflow-x-auto gap-2 items-center custom-scrollbar">
        <button *ngFor="let league of availableLeagues" (click)="setLeague(league)"
            [class.bg-blue-600]="activeLeague === league" [class.text-white]="activeLeague === league"
            [class.shadow-md]="activeLeague === league" [class.hover:bg-blue-700]="activeLeague === league"
            [class.bg-gray-100]="activeLeague !== league" [class.text-gray-600]="activeLeague !== league"
            [class.dark:bg-gray-700]="activeLeague !== league" [class.dark:text-gray-300]="activeLeague !== league"
            [class.hover:bg-gray-200]="activeLeague !== league" [class.dark:hover:bg-gray-600]="activeLeague !== league"
            class="px-5 py-2 rounded-xl text-sm font-bold tracking-wide transition-all duration-200 focus:outline-none flex flex-shrink-0 items-center justify-center min-w-[140px]">
            {{ league }}
        </button>
    </div>

    <!-- Map Area -->
    <div class="map-wrapper relative w-full flex-1 overflow-hidden">
        <!-- Map Container -->
        <div #map class="w-full h-full z-0"></div>

        <!-- Sidebar Overlay for Team Details -->
        <div class="sidebar absolute top-0 right-0 h-full w-full sm:w-96 bg-white dark:bg-gray-800 shadow-2xl z-[1000] transform transition-transform duration-300 ease-in-out p-6 flex flex-col border-l border-gray-200 dark:border-gray-700"
            [ngClass]="selectedTeam ? 'translate-x-0' : 'translate-x-full'">

            <button (click)="closeSidebar()"
                class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 dark:hover:text-white transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>

            <div *ngIf="selectedTeam" class="mt-8 flex flex-col gap-4 overflow-y-auto custom-scrollbar flex-1 pb-6">

                <!-- Logo and Header -->
                <div class="flex flex-col items-center gap-4 py-4 text-center">
                    <div
                        class="w-32 h-32 bg-gray-50 dark:bg-gray-700/50 rounded-2xl p-4 shadow-inner flex items-center justify-center border border-gray-100 dark:border-gray-600">
                        <img [src]="selectedTeamLogoUrl" [alt]="selectedTeam.name"
                            class="max-w-full max-h-full object-contain filter drop-shadow-md" />
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900 dark:text-white tracking-tight">{{ selectedTeam.name
                            }}
                        </h2>
                        <div
                            class="inline-flex mt-1 items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 text-sm font-medium border border-blue-100 dark:border-blue-800/50">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                                </path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            {{ selectedTeam.region | translate }}
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-100 dark:border-gray-700/60 pt-6 mt-2">
                    <!-- Quick Stats -->
                    <div class="grid grid-cols-2 gap-3 mb-8">
                        <div
                            class="bg-gray-50 dark:bg-gray-700/30 p-4 rounded-xl border border-gray-100 dark:border-gray-700/50 flex flex-col items-center justify-center text-center">
                            <span
                                class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider font-semibold mb-1">{{
                                'details.founded_in' | translate }}</span>
                            <span class="text-xl font-bold text-gray-800 dark:text-gray-200">{{ selectedTeam.founded
                                }}</span>
                        </div>
                        <div
                            class="bg-gray-50 dark:bg-gray-700/30 p-4 rounded-xl border border-gray-100 dark:border-gray-700/50 flex flex-col items-center justify-center text-center">
                            <span
                                class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wider font-semibold mb-1">{{
                                'nav.map' | translate }}</span>
                            <span class="font-bold text-gray-800 dark:text-gray-200">{{ selectedTeam.region | translate
                                }}</span>
                        </div>
                    </div>

                    <!-- History Scroll -->
                    <div>
                        <h3 class="flex items-center gap-2 text-lg font-bold text-gray-900 dark:text-white mb-3">
                            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                                </path>
                            </svg>
                            {{ 'details.history' | translate }}
                        </h3>
                        <div
                            class="prose prose-sm dark:prose-invert prose-blue max-w-none text-gray-600 dark:text-gray-300 leading-relaxed bg-blue-50/50 dark:bg-blue-900/10 p-4 rounded-xl border border-blue-100/50 dark:border-blue-900/30">
                            {{ selectedTeam.historyKey | translate }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

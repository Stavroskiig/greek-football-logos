<div class="max-w-6xl mx-auto my-8 px-4">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">League Manager</h1>
    <p class="text-gray-600 dark:text-gray-400">Bulk edit and reassign teams to leagues</p>

    <!-- Success Message -->
    <div *ngIf="successMessage"
      class="fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 animate-fade-in">
      {{ successMessage }}
    </div>
    
    <!-- Error Message -->
    <div *ngIf="errorMessage"
      class="fixed top-4 right-4 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg z-50 animate-fade-in">
      {{ errorMessage }}
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Left Column: Teams List & Filters -->
    <div class="lg:col-span-2">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 transition-colors duration-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-xl font-semibold text-gray-800 dark:text-white">Teams ({{ filteredTeams.length }})</h2>
          <button (click)="toggleAll()" class="text-sm px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded text-gray-700 dark:text-gray-200">
            {{ isAllSelected() ? 'Deselect All' : 'Select All' }}
          </button>
        </div>

        <!-- Search and Filter -->
        <div class="flex flex-col sm:flex-row gap-3 mb-4">
          <input type="text" [(ngModel)]="searchTerm" (input)="filterTeams()" placeholder="Search teams..."
            class="flex-1 px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">

          <select [(ngModel)]="filterLeague" (change)="onFilterLeagueChange($event)"
            class="flex-1 px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="">🌍 All Leagues</option>
            <option *ngFor="let league of leagues" [value]="league.id">{{ league.name }}</option>
          </select>
          
          <button (click)="clearFilters()"
            class="px-4 py-2 text-sm text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200">
            Clear
          </button>
        </div>

        <!-- Team List -->
        <div class="space-y-2 max-h-[600px] overflow-y-auto pr-2">
          <div *ngFor="let team of filteredTeams; trackBy: trackByTeamId" (click)="toggleSelection(team.id)"
            class="flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-colors duration-200 hover:bg-gray-50 dark:hover:bg-gray-700/50 border border-transparent"
            [class.bg-blue-50]="selectedTeamIds.has(team.id)" [class.dark:bg-blue-900]="selectedTeamIds.has(team.id)" [class.border-blue-200]="selectedTeamIds.has(team.id)">
            
            <div class="flex-shrink-0">
              <input type="checkbox" [checked]="selectedTeamIds.has(team.id)" (click)="$event.stopPropagation(); toggleSelection(team.id)" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
            </div>
            
            <img [src]="team.path" [alt]="team.name" class="w-10 h-10 object-contain bg-white rounded p-1">
            
            <div class="flex-1 min-w-0">
              <div class="font-medium text-gray-900 dark:text-gray-100 truncate">{{ team.name }}</div>
              <div class="text-sm text-gray-500 dark:text-gray-400">{{ team.league?.name || 'No League' }}</div>
            </div>
          </div>
          
          <div *ngIf="filteredTeams.length === 0" class="text-center py-8 text-gray-500">
            No teams found matching your filters.
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column: Bulk Action -->
    <div class="lg:col-span-1">
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 sticky top-6">
        <h2 class="text-xl font-semibold text-gray-800 dark:text-white mb-6">Bulk Assign League</h2>
        
        <div class="mb-6 p-4 bg-blue-50 dark:bg-blue-900/30 rounded-lg border border-blue-100 dark:border-blue-800">
          <div class="text-3xl font-bold text-blue-600 dark:text-blue-400 mb-1">{{ selectedTeamIds.size }}</div>
          <div class="text-sm text-gray-600 dark:text-gray-400">Teams Selected</div>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Target League</label>
          <select [(ngModel)]="targetLeagueId"
            class="w-full px-3 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="" disabled selected>Select a league...</option>
            <option *ngFor="let league of leagues" [value]="league.id">{{ league.name }}</option>
          </select>
        </div>

        <button (click)="applyLeague()" [disabled]="selectedTeamIds.size === 0 || !targetLeagueId || isUpdating"
          class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200 font-medium">
          <svg *ngIf="isUpdating" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isUpdating ? 'Updating...' : 'Apply League' }}
        </button>
      </div>
    </div>
  </div>
</div>

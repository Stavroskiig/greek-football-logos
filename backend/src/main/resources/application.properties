spring.application.name=api

# PostgreSQL Configuration (Supports ENV vars for production, defaults to local)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/greek_football_logos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:stavros}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration (Auto-generate schema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port (Render passes PORT env var)
server.port=${PORT:8080}
